<div class="list-header">
  <div>
    <p class="eyebrow">Finance</p>
    <h1 class="admin-page-title">Fines</h1>
    <p class="admin-page-lede">All fines issued across the system.</p>
  </div>
</div>

<div class="admin-form" style="margin-bottom: 1.5rem">
  <div class="admin-form__field">
    <label>Search</label>
    <input
      type="text"
      class="form-control form-control-sm"
      [(ngModel)]="filters.search"
      (keyup.enter)="applyFilters()"
      placeholder="Fine # or driver"
    />
  </div>
  <div class="admin-form__field">
    <label>Status</label>
    <select class="form-select form-select-sm" [(ngModel)]="filters.status">
      <option value="">Any</option>
      <option *ngFor="let opt of statusOptions" [value]="opt.value">{{ opt.label }}</option>
    </select>
  </div>
  <div class="admin-form__field">
    <label>Driver ID</label>
    <input type="text" class="form-control form-control-sm" [(ngModel)]="filters.driverId" placeholder="Driver UUID" />
  </div>
  <div class="admin-form__field">
    <label>Violation ID</label>
    <input type="text" class="form-control form-control-sm" [(ngModel)]="filters.violationId" placeholder="Violation UUID" />
  </div>
  <div class="admin-form__field">
    <label>Issued by</label>
    <input type="text" class="form-control form-control-sm" [(ngModel)]="filters.issuedById" placeholder="Officer UUID" />
  </div>
  <div class="admin-form__field">
    <label>Issued from</label>
    <input type="date" class="form-control form-control-sm" [(ngModel)]="filters.issuedFrom" />
  </div>
  <div class="admin-form__field">
    <label>Issued to</label>
    <input type="date" class="form-control form-control-sm" [(ngModel)]="filters.issuedTo" />
  </div>
  <div class="admin-form__field admin-form__field--checkbox">
    <label>
      <input type="checkbox" [(ngModel)]="filters.overdueDatePassed" />
      Overdue only
    </label>
  </div>
  <div class="admin-form__field admin-form__field--actions">
    <button class="btn btn-primary btn-sm" type="button" (click)="applyFilters()">Apply</button>
    <button class="btn btn-outline-secondary btn-sm" type="button" (click)="resetFilters()">Reset</button>
  </div>
</div>

<div class="auth-alert auth-alert--error" *ngIf="actionError">{{ actionError }}</div>

<app-data-table
  [columns]="columns"
  [rows]="fines"
  [loading]="loading"
  [error]="error"
  [page]="page"
  [hasMore]="hasMore"
  [count]="count"
  [sortColumn]="sortColumn"
  [sortDirection]="sortDirection"
  emptyMessage="No fines match these filters."
  (pageChange)="onPageChange($event)"
  (sortChange)="onSortChange($event)"
>
  <ng-template #rowActions let-row>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <a class="btn btn-outline-primary btn-sm" [routerLink]="['/admin/fines', row.id]">View</a>
      <ng-container *ngIf="canCancel(row)">
        <input
          type="text"
          class="form-control form-control-sm"
          style="width: 180px"
          placeholder="Cancellation reason"
          [(ngModel)]="reasonDraft[row.id]"
        />
        <button
          class="btn btn-outline-secondary btn-sm"
          type="button"
          [disabled]="!canSubmitCancel(row) || processingId === row.id"
          (click)="requestCancel(row)"
        >
          Cancel fine
        </button>
      </ng-container>
    </div>
  </ng-template>
</app-data-table>

<app-confirm-dialog
  [open]="confirmOpen"
  [tone]="confirmTone"
  [title]="confirmTitle"
  [message]="confirmMessage"
  confirmLabel="Cancel fine"
  (confirmed)="onDialogConfirmed()"
  (cancelled)="onDialogCancelled()"
></app-confirm-dialog>
